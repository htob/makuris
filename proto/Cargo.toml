[package]
name = "makuris-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# 配对挑战应答用 HMAC-SHA256，令牌与 nonce 用系统随机数。
# 放在共享协议层而不是两端各写一遍：算法、编码、位数必须逐字一致，
# 任何一处偏差都会表现为「明明输对了码却配对失败」，且不报错只静默拒绝。
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
